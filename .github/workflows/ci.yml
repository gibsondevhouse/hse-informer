name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artifact-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose configuration and Keycloak realm
        run: |
          cp infra/.env.example infra/.env
          sh infra/scripts/prepare-dev-tls.sh
          docker compose --env-file infra/.env -f infra/compose.yaml config --quiet
          python3 infra/scripts/verify-keycloak-isolation.py --config-only
      - name: Verify synthetic SCORM 1.2 package
        run: python3 -m unittest discover -s infra/scorm -p 'test_*.py'
      - name: Verify synthetic HSI reconciliation
        run: python3 -m unittest discover -s tools/hsi-reconcile -p 'test_*.py'

  admin-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-app/package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build

  moodle-synthetic-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYCLOAK_URL: https://auth.localhost:8443
    steps:
      - uses: actions/checkout@v4
      - name: Start separate Moodle sites and Keycloak
        run: |
          cp infra/.env.example infra/.env
          sh infra/scripts/prepare-dev-tls.sh
          echo '127.0.0.1 auth.localhost' | sudo tee -a /etc/hosts > /dev/null
          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/infra/.dev-tls/ca.crt" >> "$GITHUB_ENV"
          docker compose --env-file infra/.env -f infra/compose.yaml up -d --build keycloak moodle-a moodle-b
      - name: Check Moodle and issuer readiness
        run: python3 infra/scripts/check-stack.py
      - name: Verify company sign-in realm boundaries
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/.env
          set +a
          python3 infra/scripts/verify-keycloak-isolation.py
      - name: Exercise synthetic Moodle token isolation, provisioning, enrollment, and completion reads
        shell: bash
        run: |
          set -euo pipefail
          A="$(docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data moodle-a php /opt/hse/bootstrap-pilot.php)"
          B="$(docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data moodle-b php /opt/hse/bootstrap-pilot.php)"
          A_TOKEN="$(jq -er .token <<<"$A")"
          B_TOKEN="$(jq -er .token <<<"$B")"
          echo "::add-mask::$A_TOKEN"
          echo "::add-mask::$B_TOKEN"
          MOODLE_A_TOKEN="$A_TOKEN" MOODLE_B_TOKEN="$B_TOKEN" \
            python3 infra/scripts/verify-moodle-isolation.py
          MOODLE_A_PILOT="$A" MOODLE_B_PILOT="$B" \
            MOODLE_PILOT_EVIDENCE=infra/moodle-pilot-evidence.json \
            python3 infra/scripts/verify-moodle-pilot.py
      - name: Upload synthetic Moodle REST evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-moodle-rest-evidence
          path: infra/moodle-pilot-evidence.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned browser tooling
        id: browser_tools
        run: |
          npm ci --prefix web
          ./web/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n hse-dev -t 'C,,' -i infra/.dev-tls/ca.crt
      - name: Verify HSE browser identity, privileged MFA, and account service boundaries
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/.env
          set +a
          node --test infra/scripts/test-hse-identity-callback.cjs
          node infra/scripts/verify-hse-identity.cjs
      - name: Launch synthetic SCORM in Moodle browser and read tracking
        id: scorm_browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/.env
          set +a
          python3 infra/scorm/build.py --output infra/scorm/synthetic-scorm-1.2.zip
          docker compose --env-file infra/.env -f infra/compose.yaml cp \
            infra/scorm/synthetic-scorm-1.2.zip moodle-a:/tmp/synthetic-scorm-1.2.zip
          docker compose --env-file infra/.env -f infra/compose.yaml exec -T moodle-a \
            php -l /opt/hse/bootstrap-scorm.php
          docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data moodle-a \
            sh -c 'test -r /tmp/synthetic-scorm-1.2.zip'
          A="$(docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data moodle-a php /opt/hse/bootstrap-pilot.php)"
          echo "::add-mask::$(jq -r .token <<<"$A")"
          SCORM="$(docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data \
            -e SCORM_LEARNER_PASSWORD="$SCORM_LEARNER_PASSWORD" moodle-a php /opt/hse/bootstrap-scorm.php)"
          MOODLE_A_PILOT="$A" MOODLE_SCORM_FIXTURE="$SCORM" SCORM_LEARNER_PASSWORD="$SCORM_LEARNER_PASSWORD" \
            node infra/scripts/verify-scorm-browser.cjs
          OAUTH="$(docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data \
            -e MOODLE_A_OIDC_CLIENT_SECRET="$MOODLE_A_OIDC_CLIENT_SECRET" moodle-a php /opt/hse/bootstrap-oauth.php)"
          echo "::add-mask::$(jq -er .bridgeToken <<<"$OAUTH")"
          MOODLE_A_PILOT="$A" MOODLE_SCORM_FIXTURE="$SCORM" MOODLE_OAUTH_FIXTURE="$OAUTH" \
            node infra/scripts/verify-moodle-sso.cjs
          docker compose --env-file infra/.env -f infra/compose.yaml exec -T -u www-data \
            moodle-a php /var/www/moodle/admin/cli/cron.php
          MOODLE_A_PILOT="$A" MOODLE_SCORM_FIXTURE="$SCORM" \
            MOODLE_SCORM_EVIDENCE=infra/scorm-browser-evidence.json \
            python3 infra/scripts/verify-scorm-read.py
      - name: Upload synthetic SCORM browser evidence
        if: ${{ !cancelled() && steps.scorm_browser.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-scorm-browser-evidence
          path: |
            infra/scorm-browser-evidence.json
            infra/moodle-sso-evidence.json
          retention-days: 7
      - name: Upload SCORM failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-scorm-failure
          path: |
            infra/scorm-browser-failure.png
            infra/scorm-browser-evidence.json
            infra/moodle-sso-evidence.json
            infra/moodle-sso-failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Show stack logs on failure
        if: failure()
        run: docker compose --env-file infra/.env -f infra/compose.yaml logs --tail=100
      - name: Stop synthetic stack
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yaml down -v

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hse_ci
          POSTGRES_USER: hse_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hse_ci -d hse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgres://hse_ci:ci-only-password@localhost:5432/hse_ci
      TEST_DATABASE_URL: postgres://hse_ci:ci-only-password@localhost:5432/hse_ci
      APP_ORIGIN: http://localhost:5173
      OIDC_ISSUER: https://auth.localhost:8443/realms/hse-dev
      OIDC_CLIENT_ID: hse-web
      OIDC_CLIENT_SECRET: ci-only-oidc-secret
      SESSION_SECRET: ci-only-session-secret-with-32-bytes-minimum
      MOODLE_CONNECTIONS_JSON: '{}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run db:seed:synthetic
      - name: Install React preview for shared browser checks
        run: npm ci --prefix ../admin-app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DEV_AUTH: synthetic
      - run: npm run test:e2e:beta
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-failures
          path: |
            web/test-results
            web/e2e/ui-standard.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
