<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public
    <Directory /var/www/moodle/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Do not put OAuth callback query strings or client addresses into access logs.
    LogFormat "%m %U %H %>s" hse_path_only
    CustomLog ${APACHE_LOG_DIR}/access.log hse_path_only
</VirtualHost>
